name: Build Parsh CleanShieldPro APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 34
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Generate Gradle wrapper if absent
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.2
          fi
          chmod +x ./gradlew

      - name: Validate patch formatting
        run: git diff --check

      - name: Run DNS codec unit tests
        run: ./gradlew --no-daemon testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Parsh-CleanShieldPro.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Parsh-CleanShieldPro
          path: Parsh-CleanShieldPro.apk
          if-no-files-found: error
          retention-days: 14
