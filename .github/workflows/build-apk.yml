name: Build CleanShield Pro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # Allows manual trigger from GitHub website

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            echo "Creating temporary Gradle wrapper..."
            gradle wrapper --gradle-version 8.2 || true
            ./gradlew assembleDebug --stacktrace || echo "Build needs full project setup"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanShieldPro-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
